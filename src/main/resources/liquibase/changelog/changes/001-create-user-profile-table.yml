databaseChangeLog:
  - changeSet:
      id: 001-create-user-profile-table
      author: user-profile-service
      changes:
        - createTable:
            tableName: user_profile
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_user_profile
                    nullable: false

              - column:
                  name: guid
                  type: UUID
                  constraints:
                    unique: true
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: surname
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: middle_name
                  type: VARCHAR(100)

              - column:
                  name: date_of_birth
                  type: DATE

              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    unique: true

              - column:
                  name: phone
                  type: VARCHAR(20)

              - column:
                  name: profile_status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false

        - sql:
            sql: >
              Alter TABLE user_profile 
              ADD CONSTRAINT chk_user_profile_status
              CHECK (profile_status IN ('ACTIVE', 'INACTIVE', 'BLOCKED'));
