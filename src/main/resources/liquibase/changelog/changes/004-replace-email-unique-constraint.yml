databaseChangeLog:
  - changeSet:
      id: 004-replace-email-unique-constraint
      author: user-profile-server
      changes:
        - dropUniqueConstraint:
            tableName: user_profile
            constraintName: user_profile_email_key
        - sql:
            sql: >
              CREATE UNIQUE INDEX uq_user_profile_email_not_deleted
              ON user_profile (email)
              WHERE deleted_at IS NULL;