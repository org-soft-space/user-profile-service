spring:
  application:
    name: user-profile-service

  liquibase:
    change-log: classpath:liquibase/changelog/master.yml
  jpa:
    hibernate:
      ddl-auto: none
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  port: ${PORT}
  ssl:
    key-store: classpath:security/keystore.p12
    key-store-password: ${KEYSTORE_PASSWORD}
    key-store-type: PKCS12
    key-password: ${KEYSTORE_PASSWORD}
    key-alias: ${KEY_ALIAS}
    enabled-protocols:
      - TLSv1.2
      - TLSv1.3

management:
  endpoints:
    web:
      exposure:
        include: health,info,env

  info:
    env:
      enabled: true
info:
  app:
    name: user-profile-service

logging:
  level:
    org.softspace.userprofile: DEBUG
    org.springframework: INFO
